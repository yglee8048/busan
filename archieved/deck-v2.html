<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기준을 세우고, 적용하고, 다시 검증하기 · v2.0</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#fbfbfa;
  --panel:#f2f2ef;
  --ink:#16181a;
  --ink-2:#4a4f53;
  --ink-3:#7d8388;
  --rule:#e0e0dc;
  --rule-2:#ecece8;
  --s1:#5d82a6;  --s1-t:#e6edf3;  --s1-b:#b6cbdd;
  --s2:#5c7a58;  --s2-t:#e8eee6;  --s2-b:#bccdb8;
  --s3:#a86a4a;  --s3-t:#f4e9e2;  --s3-b:#e0bda9;
  --warn:#8a6d2f; --warn-t:#f5efdd;
  --acc:var(--ink); --acc-t:var(--panel); --acc-b:var(--rule);
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:var(--sans);
  --mono:"JetBrains Mono","SFMono-Regular",ui-monospace,Menlo,"Pretendard Variable",monospace;
  --label:var(--sans);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131416; --panel:#1c1e21; --ink:#e9e9e6; --ink-2:#b0b4b7; --ink-3:#83888c;
    --rule:#2e3135; --rule-2:#232629;
    --s1:#9dbfdd; --s1-t:#1b2530; --s1-b:#3d5773;
    --s2:#a3c09c; --s2-t:#1c241b; --s2-b:#47603f;
    --s3:#dda98a; --s3-t:#2a1e17; --s3-b:#7a4f36;
    --warn:#d9bb77; --warn-t:#292315;
  }
}
:root[data-theme="dark"]{
  --paper:#131416; --panel:#1c1e21; --ink:#e9e9e6; --ink-2:#b0b4b7; --ink-3:#83888c;
  --rule:#2e3135; --rule-2:#232629;
  --s1:#9dbfdd; --s1-t:#1b2530; --s1-b:#3d5773;
  --s2:#a3c09c; --s2-t:#1c241b; --s2-b:#47603f;
  --s3:#dda98a; --s3-t:#2a1e17; --s3-b:#7a4f36;
  --warn:#d9bb77; --warn-t:#292315;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;
  font-variant-numeric:tabular-nums;letter-spacing:-.008em;word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}

/* ---------- stage ---------- */
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper)}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;
  background:var(--paper);display:flex;flex-direction:column;padding:34px 60px 30px}
.slide{display:none;flex-direction:column;height:100%;animation:in .18s ease-out}
.slide.on{display:flex}
@keyframes in{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}

/* ---------- rails ---------- */
.rail{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-bottom:9px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.rail-l{display:flex;align-items:baseline;gap:12px;min-width:0}
.sec{font-family:var(--label);font-size:11.5px;letter-spacing:.04em;
  color:var(--acc);font-weight:600;white-space:nowrap}
.code{font-family:var(--mono);font-size:11px;letter-spacing:.09em;color:var(--ink-3)}
.rail-r{font-family:var(--label);font-size:11.5px;letter-spacing:.01em;color:var(--ink-3);white-space:nowrap}
.chip{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.01em;
  padding:2.5px 8px;border-radius:2px;background:var(--acc-t);color:var(--acc);
  border:1px solid var(--acc-b);white-space:nowrap}

/* ---------- head ---------- */
.head{flex:0 0 auto;padding:20px 0 16px}
h2{font-family:var(--display);font-weight:750;font-size:36px;line-height:1.24;margin:0;
  letter-spacing:-.025em;text-wrap:balance}
h2.sm{font-size:29px}
.sub{margin:9px 0 0;font-size:15px;line-height:1.6;color:var(--ink-2);max-width:78ch;font-weight:300}

/* ---------- body ---------- */
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:16px;padding-bottom:4px}
.body::-webkit-scrollbar{width:5px}
.body::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}
.split.w{grid-template-columns:1.35fr 1fr}
.split.n{grid-template-columns:1fr 1.35fr}
.stack{display:flex;flex-direction:column;gap:15px;min-width:0}

p.t{margin:0;font-size:15.5px;line-height:1.68;color:var(--ink-2);max-width:80ch}
p.t strong{color:var(--ink);font-weight:600}

.lead{font-family:var(--display);font-size:25px;line-height:1.5;margin:0;font-weight:700;
  letter-spacing:-.018em;text-wrap:balance;padding-left:18px;border-left:3px solid var(--acc-b)}
.lead.sm{font-size:21px}
.lead em{font-style:normal;color:var(--acc)}

ul.b,ol.b{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
ul.b>li{position:relative;padding-left:17px;font-size:15px;line-height:1.6;color:var(--ink-2)}
ul.b>li::before{content:"";position:absolute;left:1px;top:.66em;width:6px;height:1.5px;background:var(--acc-b)}
ol.b{counter-reset:n}
ol.b>li{counter-increment:n;position:relative;padding-left:26px;font-size:15px;line-height:1.6;color:var(--ink-2)}
ol.b>li::before{content:counter(n);position:absolute;left:0;top:.05em;font-family:var(--mono);
  font-size:11px;font-weight:500;color:var(--acc);letter-spacing:.02em}
li strong{color:var(--ink);font-weight:600}

table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.tw{overflow-x:auto}
thead th{font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);text-align:left;padding:0 12px 7px 0;
  border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:bottom}
tbody td{padding:9px 12px 9px 0;border-bottom:1px solid var(--rule-2);color:var(--ink-2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody td:first-child{color:var(--ink);font-weight:500;white-space:nowrap}
table.free tbody td:first-child{white-space:normal}
td strong,th strong{color:var(--ink);font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right;padding-right:0}
td.num{padding-right:0}

pre{margin:0;font-family:var(--mono);word-break:normal;font-size:13px;line-height:1.62;color:var(--ink-2);
  background:var(--panel);border:1px solid var(--rule-2);border-radius:2px;
  padding:14px 16px;overflow-x:auto;white-space:pre;letter-spacing:-.005em}
pre b{color:var(--acc);font-weight:500}
code{font-family:var(--mono);font-size:.9em;background:var(--panel);
  padding:1px 5px;border-radius:2px;color:var(--ink);letter-spacing:-.01em}

.note{border-left:3px solid var(--acc-b);background:var(--acc-t);padding:12px 16px;border-radius:0 2px 2px 0}
.note .nl{font-family:var(--label);font-size:11px;letter-spacing:.03em;
  color:var(--acc);font-weight:600;display:block;margin-bottom:5px}
.note p{margin:0;font-size:14.5px;line-height:1.62;color:var(--ink-2)}
.note.warn{--acc:var(--warn);--acc-t:var(--warn-t);--acc-b:var(--warn)}

.cols{display:grid;gap:0;border-top:1px solid var(--rule)}
.cols.c2{grid-template-columns:1fr 1fr}
.cols.c3{grid-template-columns:1fr 1fr 1fr}
.col{padding:13px 20px 4px 0;border-right:1px solid var(--rule-2)}
.col:last-child{border-right:0;padding-right:0}
.cols.c2 .col+.col,.cols.c3 .col+.col{padding-left:20px}
.col h4{margin:0 0 10px;font-size:13.5px;font-weight:600;letter-spacing:.01em;color:var(--ink)}
.col h4 .mk{font-family:var(--label);font-size:11px;color:var(--acc);letter-spacing:.02em;
  display:block;margin-bottom:4px;font-weight:600}

.kv{display:flex;flex-direction:column;gap:0}
.kv>div{display:grid;grid-template-columns:180px 1fr;gap:18px;padding:9px 0;
  border-bottom:1px solid var(--rule-2);font-size:14.5px;line-height:1.55}
.kv>div:last-child{border-bottom:0}
.kv dt{color:var(--ink);font-weight:600}
.kv dd{margin:0;color:var(--ink-2)}

.cards{display:grid;gap:14px}
.cards.g2{grid-template-columns:1fr 1fr}
.cards.g3{grid-template-columns:repeat(3,1fr)}
.cards.g4{grid-template-columns:repeat(4,1fr)}
.card{border:1px solid var(--rule);border-radius:2px;padding:14px 15px;background:var(--paper)}
.card h5{margin:0 0 7px;font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:.005em}
.card p{margin:0;font-size:13.5px;line-height:1.58;color:var(--ink-2)}
.card .big{font-family:var(--display);font-size:30px;font-weight:750;color:var(--acc);letter-spacing:-.02em;
  line-height:1;margin-bottom:8px;font-variant-numeric:tabular-nums}

.beats{display:flex;flex-direction:column;gap:0}
.beats>div{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--rule-2)}
.beats>div:last-child{border-bottom:0}
.beats .i{font-family:var(--mono);font-size:11px;color:var(--acc);font-weight:500;padding-top:3px}
.beats .x{font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.beats .x strong{color:var(--ink);font-weight:600}

.say{border:1px solid var(--acc-b);border-radius:2px;padding:15px 18px;background:var(--acc-t)}
.say .sl{font-family:var(--label);font-size:11px;letter-spacing:.03em;
  color:var(--acc);font-weight:600;display:block;margin-bottom:6px}
.say p{margin:0;font-family:var(--display);font-size:18.5px;line-height:1.58;color:var(--ink);
  font-weight:500;letter-spacing:-.012em}

/* ---------- quadrant ---------- */
.quad{display:grid;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.quad .qh{font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);
  padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--rule);text-transform:uppercase}
.quad .qy{font-size:13px;font-weight:600;color:var(--ink);padding:14px 12px;background:var(--panel);
  display:flex;align-items:center;border-top:1px solid var(--rule-2)}
.quad .qc{padding:14px 14px;font-size:13.5px;line-height:1.5;color:var(--ink-2);
  border-left:1px solid var(--rule-2);border-top:1px solid var(--rule-2)}
.quad .qc strong{color:var(--ink)}
.quad .qc.hot{background:var(--acc-t);box-shadow:inset 0 0 0 1.5px var(--acc)}
.quad .qc .qm{display:block;font-family:var(--label);font-size:10.5px;font-weight:600;letter-spacing:.02em;
  color:var(--acc);margin-bottom:5px}

/* ---------- flow ---------- */
.flow{display:flex;align-items:stretch}
.flow .fs{flex:1 1 0;min-width:0;border:1px solid var(--rule);border-radius:2px;
  padding:11px 12px;background:var(--paper);display:flex;flex-direction:column;gap:4px}
.flow .fs.hot{border-color:var(--acc);background:var(--acc-t);box-shadow:inset 0 0 0 1px var(--acc)}
.flow .fs.dim{opacity:.5}
.flow .ft{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35}
.flow .fn{font-size:11.5px;line-height:1.45;color:var(--ink-3)}
.flow .fs.hot .fn{color:var(--acc)}
.flow .fa{flex:0 0 auto;display:flex;align-items:center;padding:0 9px;
  font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.flowl{font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.02em;
  color:var(--ink-3);margin-bottom:8px;display:block}

/* ---------- steps ---------- */
.steps{display:flex;flex-direction:column}
.steps .st{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;
  border:1px solid var(--rule);border-radius:2px;padding:11px 14px;background:var(--paper)}
.steps .st.hot{border-color:var(--acc);background:var(--acc-t)}
.steps .st+.st{margin-top:20px;position:relative}
.steps .st+.st::before{content:"↓";position:absolute;left:24px;top:-18px;
  font-family:var(--mono);font-size:13px;color:var(--ink-3);line-height:1}
.steps .sn{font-family:var(--mono);font-size:11px;color:var(--acc);font-weight:500;padding-top:2px}
.steps .sh{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
.steps .sx{display:block;margin-top:3px;font-size:13px;line-height:1.55;color:var(--ink-2);font-weight:400}

/* ---------- whiteboard ---------- */
.board{border:1.5px dashed var(--ink-3);border-radius:3px;padding:16px 20px 20px;background:var(--panel)}
.board .bl{font-family:var(--label);font-size:11px;letter-spacing:.02em;
  color:var(--acc);font-weight:600;display:block;margin-bottom:14px}
.board .brow{height:1px;background:var(--ink-3);margin:0 0 26px;position:relative;opacity:.5}
.board .brow:last-child{margin-bottom:2px}
.board .brow::before{content:"";position:absolute;left:0;top:-9px;width:7px;height:7px;
  border:1px solid var(--ink-3);border-radius:50%}

/* ---------- figures ---------- */
.fig{margin:0}
.fig svg{display:block;width:100%;max-width:880px;height:auto;overflow:visible}
.fig .cap{margin-top:9px;font-size:12.5px;line-height:1.55;color:var(--ink-3)}
.fig .cap b{color:var(--ink);font-weight:600}
svg text{font-family:var(--label);letter-spacing:0}
svg .lb{font-size:10px;fill:var(--ink-3)}
svg .vl{font-size:11px;fill:var(--ink);font-weight:500}
svg .hi{fill:var(--acc)}

/* ---------- chrome ---------- */
#bar{position:fixed;left:0;right:0;top:0;height:2px;background:transparent;z-index:20;display:flex}
#bar i{display:block;height:100%;background:var(--ink);opacity:.28;transition:width .18s ease}
#hud{position:fixed;right:16px;bottom:12px;z-index:40;display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
#hud button{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:3px 9px;
  cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-3)}
#hud button:hover{border-color:var(--ink-3);color:var(--ink)}
#hud button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
#hud button:focus-visible,#toc button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#cnt{font-variant-numeric:tabular-nums}

/* ---------- presenter notes ---------- */
#notes{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:40vh;overflow-y:auto;
  background:var(--panel);border-top:1px solid var(--rule);padding:14px 22px 34px}
#notes[hidden]{display:none}
#notes .nh{display:flex;align-items:baseline;gap:12px;margin-bottom:9px}
#notes .nt{font-family:var(--label);font-size:11px;letter-spacing:.03em;
  color:var(--ink);font-weight:600}
#notes .nk{font-family:var(--label);font-size:11px;color:var(--ink-3);letter-spacing:.01em}
#notes ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;
  gap:6px 32px;counter-reset:c}
#notes li{counter-increment:c;position:relative;padding-left:18px;font-size:13px;
  line-height:1.55;color:var(--ink-2)}
#notes li::before{content:counter(c);position:absolute;left:0;top:.15em;font-family:var(--mono);
  font-size:10px;color:var(--ink-3);font-weight:500}
#notes li strong{color:var(--ink);font-weight:600}
#notes .empty{font-size:13px;color:var(--ink-3)}

/* ---------- cover ---------- */
.cover{justify-content:center;padding-bottom:60px}
.cover .kicker{font-family:var(--label);font-size:12.5px;font-weight:600;letter-spacing:.06em;
  color:var(--ink-3);margin-bottom:26px}
.cover h1{font-family:var(--display);font-weight:800;font-size:58px;line-height:1.18;margin:0;
  letter-spacing:-.038em;max-width:20ch}
.cover .dek{margin:22px 0 0;font-size:17px;line-height:1.7;color:var(--ink-2);max-width:56ch;font-weight:300}
.cover .meta{margin-top:44px;padding-top:20px;border-top:1px solid var(--rule);
  display:flex;gap:40px;font-family:var(--label);font-size:12.5px;letter-spacing:.005em;color:var(--ink-3)}
.cover .meta b{display:block;color:var(--ink);font-weight:600;margin-bottom:5px;letter-spacing:0}

.divider{justify-content:center}
.divider .n{font-family:var(--label);font-size:12.5px;font-weight:600;letter-spacing:.05em;color:var(--acc);margin-bottom:22px}
.divider h1{font-family:var(--display);font-weight:800;font-size:48px;line-height:1.2;margin:0;
  letter-spacing:-.034em;max-width:22ch}
.divider .dek{margin:20px 0 0;font-size:16.5px;line-height:1.7;color:var(--ink-2);max-width:62ch;font-weight:300}
.divider .agenda{margin-top:36px;padding-top:18px;border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:8px 26px}
.divider .agenda span{font-size:13px;color:var(--ink-3)}
.divider .agenda span b{font-family:var(--mono);font-size:11px;color:var(--acc);
  font-weight:500;margin-right:7px;letter-spacing:.02em}

#toc{position:fixed;inset:0;z-index:50;background:var(--paper);padding:44px 56px;overflow-y:auto}
#toc[hidden]{display:none}
#toc h3{font-family:var(--display);font-size:25px;margin:0 0 6px;font-weight:750;letter-spacing:-.022em}
#toc .hint{font-family:var(--label);font-size:11.5px;color:var(--ink-3);letter-spacing:.01em;margin-bottom:26px}
#toc .grp{margin-bottom:26px}
#toc .gh{font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.03em;
  color:var(--ink-3);padding-bottom:7px;border-bottom:1px solid var(--rule);margin-bottom:10px}
#toc .items{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 22px}
#toc button.it{display:grid;grid-template-columns:34px 1fr;gap:8px;text-align:left;background:none;
  border:0;padding:5px 6px;cursor:pointer;border-radius:2px;align-items:baseline}
#toc button.it:hover{background:var(--panel)}
#toc button.it .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
#toc button.it .t{font-size:13px;line-height:1.4;color:var(--ink-2)}
#toc button.it[data-cur="1"] .t{color:var(--ink);font-weight:600}

@media print{
  @page{size:1280px 720px;margin:0}
  body,#viewport{overflow:visible;display:block;position:static}
  #stage{transform:none!important;page-break-after:always;break-after:page}
  .slide{display:flex!important;height:720px;page-break-after:always;break-after:page}
  #hud,#bar,#toc,#notes{display:none!important}
}
</style>

<div id="bar"><i></i></div>
<div id="viewport"><div id="stage"></div></div>
<div id="hud">
  <button id="bnote" aria-label="발표자 노트" aria-pressed="false">노트 N</button>
  <button id="btoc" aria-label="목차 열기">목차 O</button>
  <button id="bprev" aria-label="이전 장표">←</button>
  <button id="bnext" aria-label="다음 장표">→</button>
  <span id="cnt">1 / 1</span>
</div>
<div id="notes" hidden>
  <div class="nh"><span class="nt">발표자 노트</span><span class="nk">N 키로 닫기 · 청중 화면에는 나오지 않음</span></div>
  <ol id="notesbody"></ol>
</div>
<div id="toc" hidden>
  <h3>목차</h3>
  <div class="hint">숫자를 눌러 이동 · ESC 또는 O 로 닫기 · ← → 로 넘기기 · N 노트 · F 전체화면</div>
  <div id="tocbody"></div>
</div>

<script>
"use strict";
/* ---------- inline markup ---------- */
function md(s){
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");
}
function raw(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ---------- figures (inline svg) ---------- */
const FIG = {};

/* 룰렛 37칸 — 빨강에 걸었을 때 이기는 칸 18 / 지는 칸 19 */
FIG.edge = function(){
  const W=580,H=96,n=37,gap=3,cw=(W-gap*(n-1))/n;
  let r="";
  for(let i=0;i<n;i++){
    const x=i*(cw+gap);
    const zero=(i===18), win=(i<18);
    const style = zero ? 'fill:var(--warn)' : win ? 'fill:var(--acc)' : 'fill:var(--rule)';
    r+='<rect x="'+x.toFixed(1)+'" y="24" width="'+cw.toFixed(1)+'" height="40" rx="1" style="'+style+'"/>';
  }
  const wWin=18*(cw+gap)-gap, xLose=18*(cw+gap), wLose=W-xLose;
  return '<div class="fig"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="유럽식 룰렛 37칸 중 18칸에서 이긴다">'+
    '<text class="lb" x="0" y="13">빨강에 걸었을 때 이기는 칸 18</text>'+
    '<text class="lb" x="'+xLose+'" y="13">0 + 검정 18 = 지는 칸 19</text>'+
    r+
    '<line x1="0" y1="72" x2="'+wWin+'" y2="72" style="stroke:var(--acc);stroke-width:1.5"/>'+
    '<line x1="'+xLose+'" y1="72" x2="'+W+'" y2="72" style="stroke:var(--rule);stroke-width:1.5"/>'+
    '<text class="vl" x="0" y="90">48.6%</text>'+
    '<text class="vl" x="'+xLose+'" y="90">51.4%</text>'+
    '</svg><p class="cap"><b>하우스 엣지 2.7%</b> = 1 − (18/37 × 2). 칸 하나 차이지만, 그 차이는 매 판 항상 카지노 쪽임.</p></div>';
};




/* 기술 부채의 금리 = 변경 빈도 × 변경당 추가 비용 */
FIG.debt = function(){
  const W=580,H=214,L=52,R=16,T=12,B=34;
  const px=v=>L+(W-L-R)*v, py=v=>T+(H-T-B)*(1-v);
  const pts=[
    [0.85,0.80,"매주 고치는 결제 모듈","hi"],
    [0.72,0.60,"배포마다 사람이 붙는 절차","hi"],
    [0.30,0.72,"가끔 손대는 리포트",""],
    [0.12,0.24,"3년째 안 건드린 배치",""],
    [0.22,0.09,"곧 폐기할 코드",""]];
  let dots="";
  pts.forEach(p=>{
    const hot=p[3]==="hi";
    dots+='<circle cx="'+px(p[0])+'" cy="'+py(p[1])+'" r="'+(hot?6:5)+'" style="fill:'+(hot?'var(--acc)':'var(--ink-3)')+';opacity:'+(hot?1:.5)+'"/>'+
      (p[0]<0.5
        ? '<text class="lb" x="'+(px(p[0])+11)+'" y="'+(py(p[1])+4)+'">'+p[2]+'</text>'
        : '<text class="vl" x="'+(px(p[0])-11)+'" y="'+(py(p[1])+4)+'" text-anchor="end">'+p[2]+'</text>');
  });
  return '<div class="fig"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="변경 빈도와 변경당 추가 비용으로 본 부채의 금리">'+
    '<rect x="'+px(0.55)+'" y="'+py(1)+'" width="'+(px(1)-px(0.55))+'" height="'+(py(0.45)-py(1))+'" style="fill:var(--acc-t)"/>'+
    '<text class="lb" x="'+(px(0.58))+'" y="'+(py(0.97)+12)+'" style="fill:var(--acc)">고금리 구역 — 먼저 갚는다</text>'+
    '<line x1="'+L+'" y1="'+py(0)+'" x2="'+(W-R)+'" y2="'+py(0)+'" class="axis" style="stroke:var(--ink-3)"/>'+
    '<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+py(0)+'" class="axis" style="stroke:var(--ink-3)"/>'+
    dots+
    '<text class="lb" x="'+L+'" y="'+(H-14)+'">변경 빈도 →</text>'+
    '<text class="lb" x="0" y="'+(T+10)+'">변경당</text><text class="lb" x="0" y="'+(T+22)+'">추가 비용</text>'+
    '</svg><p class="cap">이자율 = <b>변경 빈도 × 변경당 추가 비용</b>. 오른쪽 위만 복리로 붙음. 왼쪽 아래는 갚을 이유가 없음.</p></div>';
};


/* 추정의 분포 — 낙관 · 유력 · 비관 */
FIG.pert = function(){
  const W=580,H=150,L=20,R=20,T=16,B=30;
  const px=v=>L+(W-L-R)*((v-1)/9), py=v=>T+(H-T-B)*(1-v);
  let d="";
  for(let i=0;i<=120;i++){
    const v=1+9*(i/120);
    const h=Math.exp(-Math.pow((v-4)/(v<4?1.1:1.9),2));
    d+=(i?" L":"M")+px(v).toFixed(1)+" "+py(h).toFixed(1);
  }
  d+=" L"+px(10)+" "+py(0)+" L"+px(1)+" "+py(0)+" Z";
  const mark=(v,l,hot)=>'<line x1="'+px(v)+'" y1="'+py(0)+'" x2="'+px(v)+'" y2="'+(T+4)+'" style="stroke:var(--'+(hot?'acc':'ink-3')+');stroke-width:'+(hot?1.6:1)+';stroke-dasharray:'+(hot?'0':'3 3')+'"/>'+
    '<text class="'+(hot?'vl':'lb')+'" x="'+px(v)+'" y="'+(T-3)+'" text-anchor="middle">'+l+'</text>';
  return '<div class="fig"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="낙관 유력 비관으로 본 일정 분포">'+
    '<path d="'+d+'" style="fill:var(--acc-t);stroke:var(--acc);stroke-width:1.4"/>'+
    mark(2,"낙관 2일")+mark(4,"유력 4일",1)+mark(8,"비관 8일")+
    '<line x1="'+L+'" y1="'+py(0)+'" x2="'+(W-R)+'" y2="'+py(0)+'" class="axis" style="stroke:var(--ink-3)"/>'+
    '<text class="lb" x="'+L+'" y="'+(H-8)+'">기대값 4.3일 · 표준편차 1일 — 날짜 하나로 답하면 이 폭이 전부 사라짐</text>'+
    '</svg></div>';
};

/* ---------- block renderers ---------- */
function block(b){
  switch(b.k){
    case "lead":   return '<p class="lead'+(b.sm?" sm":"")+'">'+md(b.t)+"</p>";
    case "p":      return '<p class="t">'+md(b.t)+"</p>";
    case "ul":     return '<ul class="b">'+b.i.map(x=>"<li>"+md(x)+"</li>").join("")+"</ul>";
    case "ol":     return '<ol class="b">'+b.i.map(x=>"<li>"+md(x)+"</li>").join("")+"</ol>";
    case "pre":    return "<pre>"+raw(b.t)+"</pre>";
    case "note":   return '<div class="note'+(b.w?" warn":"")+'">'+(b.l?'<span class="nl">'+md(b.l)+"</span>":"")+"<p>"+md(b.t)+"</p></div>";
    case "say":    return '<div class="say">'+(b.l?'<span class="sl">'+md(b.l)+"</span>":"")+"<p>"+md(b.t)+"</p></div>";
    case "fig":    return FIG[b.f] ? FIG[b.f](b) : "";
    case "board":  return '<div class="board"><span class="bl">'+md(b.l||"화이트보드")+"</span>"+
                     Array.from({length:b.n||4},()=>'<div class="brow"></div>').join("")+"</div>";
    case "table":{
      const al=b.a||[];
      const th=b.h.map((h,j)=>'<th'+(al[j]==="n"?' class="num"':"")+">"+md(h)+"</th>").join("");
      const tb=b.r.map(row=>"<tr>"+row.map((c,j)=>'<td'+(al[j]==="n"?' class="num"':"")+">"+md(c)+"</td>").join("")+"</tr>").join("");
      return '<div class="tw"><table'+(b.free?' class="free"':"")+"><thead><tr>"+th+"</tr></thead><tbody>"+tb+"</tbody></table></div>";
    }
    case "cols":   return '<div class="cols c'+b.c.length+'">'+b.c.map(c=>
      '<div class="col"><h4>'+(c.m?'<span class="mk">'+md(c.m)+"</span>":"")+md(c.h)+"</h4>"+
      '<ul class="b">'+c.i.map(x=>"<li>"+md(x)+"</li>").join("")+"</ul></div>").join("")+"</div>";
    case "kv":     return '<dl class="kv">'+b.i.map(p=>"<div><dt>"+md(p[0])+"</dt><dd>"+md(p[1])+"</dd></div>").join("")+"</dl>";
    case "cards":  return '<div class="cards g'+(b.g||b.i.length)+'">'+b.i.map(c=>
      '<div class="card">'+(c.big?'<div class="big">'+md(c.big)+"</div>":"")+
      (c.h?"<h5>"+md(c.h)+"</h5>":"")+"<p>"+md(c.t)+"</p></div>").join("")+"</div>";
    case "beats":  return '<div class="beats">'+b.i.map((x,j)=>
      '<div><span class="i">'+String(j+1).padStart(2,"0")+'</span><span class="x">'+md(x)+"</span></div>").join("")+"</div>";
    case "quad":{
      const hot=(b.hot===undefined)?-1:b.hot, nx=b.x.length;
      let h='<div class="qh">'+md(b.cor||"")+"</div>"+b.x.map(t=>'<div class="qh">'+md(t)+"</div>").join("");
      let rows=b.y.map((yl,r)=>'<div class="qy">'+md(yl)+"</div>"+b.x.map((_,c)=>{
        const i=r*nx+c, cell=b.c[r][c];
        const txt=(typeof cell==="string")?{t:cell}:cell;
        return '<div class="qc'+(i===hot?" hot":"")+'">'+(txt.m?'<span class="qm">'+md(txt.m)+"</span>":"")+md(txt.t)+"</div>";
      }).join("")).join("");
      return '<div class="quad" style="grid-template-columns:120px repeat('+nx+',1fr)">'+h+rows+"</div>";
    }
    case "flow":   return '<div>'+(b.l?'<span class="flowl">'+md(b.l)+"</span>":"")+'<div class="flow">'+
      b.i.map((s,j)=>(j?'<div class="fa">→</div>':"")+
      '<div class="fs'+(s.hot?" hot":"")+(s.dim?" dim":"")+'"><span class="ft">'+md(s.t)+"</span>"+
      (s.n?'<span class="fn">'+md(s.n)+"</span>":"")+"</div>").join("")+"</div></div>";
    case "steps":  return '<div class="steps">'+b.i.map((s,j)=>
      '<div class="st'+(s.hot?" hot":"")+'"><span class="sn">'+String(j+1).padStart(2,"0")+"</span>"+
      '<div><span class="sh">'+md(s.h)+"</span>"+(s.t?'<span class="sx">'+md(s.t)+"</span>":"")+"</div></div>").join("")+"</div>";
    case "split":  return '<div class="split'+(b.w?" w":b.n?" n":"")+'"><div class="stack">'+
      b.a.map(block).join("")+'</div><div class="stack">'+b.b.map(block).join("")+"</div></div>";
  }
  return "";
}

/* ---------- slide renderer ---------- */
function render(s){
  if(s.type==="cover"){
    return '<div class="slide cover" data-acc="'+(s.acc||"0")+'">'+
      '<div class="kicker">'+md(s.kicker)+"</div><h1>"+md(s.title)+"</h1>"+
      (s.dek?'<p class="dek">'+md(s.dek)+"</p>":"")+
      '<div class="meta">'+s.meta.map(m=>"<div><b>"+md(m[0])+"</b>"+md(m[1])+"</div>").join("")+"</div></div>";
  }
  if(s.type==="divider"){
    return '<div class="slide divider" data-acc="'+(s.acc||"0")+'">'+
      '<div class="n">'+md(s.n)+"</div><h1>"+md(s.title)+"</h1>"+
      (s.dek?'<p class="dek">'+md(s.dek)+"</p>":"")+
      (s.agenda?'<div class="agenda">'+s.agenda.map(a=>"<span><b>"+md(a[0])+"</b>"+md(a[1])+"</span>").join("")+"</div>":"")+
      "</div>";
  }
  return '<div class="slide" data-acc="'+(s.acc||"0")+'">'+
    '<div class="rail"><div class="rail-l"><span class="sec">'+md(s.sec)+"</span>"+
      (s.code?'<span class="code">'+md(s.code)+"</span>":"")+
      (s.chip?'<span class="chip">'+md(s.chip)+"</span>":"")+"</div>"+
      '<div class="rail-r">'+md(s.time||"")+"</div></div>"+
    '<div class="head"><h2'+(s.title.length>26?' class="sm"':"")+">"+md(s.title)+"</h2>"+
      (s.sub?'<p class="sub">'+md(s.sub)+"</p>":"")+"</div>"+
    '<div class="body">'+(s.blocks||[]).map(block).join("")+"</div></div>";
}

/* ---------- mount ---------- */
const stage = document.getElementById("stage");
stage.innerHTML = DECK.map(s=>render(s)).join("");
const slides = Array.from(stage.children);
let cur = 0;

/* ---------- table of contents ---------- */
(function buildToc(){
  const box = document.getElementById("tocbody");
  const groups = [];
  DECK.forEach((s,i)=>{
    const g = s.group || "기타";
    let last = groups[groups.length-1];
    if(!last || last.name !== g){ last = {name:g, items:[]}; groups.push(last); }
    last.items.push({i:i, t:s.nav || s.title || ""});
  });
  box.innerHTML = groups.map(g=>
    '<div class="grp"><div class="gh">'+md(g.name)+'</div><div class="items">'+
    g.items.map(it=>'<button class="it" data-i="'+it.i+'"><span class="n">'+
      String(it.i+1).padStart(2,"0")+'</span><span class="t">'+md(it.t)+"</span></button>").join("")+
    "</div></div>").join("");
  box.addEventListener("click",e=>{
    const b = e.target.closest("button.it");
    if(!b) return;
    go(parseInt(b.dataset.i,10));
    toggleToc(false);
  });
})();

/* ---------- presenter notes ---------- */
const notesEl  = document.getElementById("notes");
const notesBody= document.getElementById("notesbody");
const noteBtn  = document.getElementById("bnote");
let notesOn = false;
function paintNotes(){
  const ns = DECK[cur].notes;
  notesBody.innerHTML = (ns && ns.length)
    ? ns.map(t=>"<li>"+md(t)+"</li>").join("")
    : '<li class="empty" style="padding-left:0">이 장표에는 노트가 없습니다.</li>';
}
function toggleNotes(on){
  notesOn = (on===undefined) ? !notesOn : !!on;
  notesEl.hidden = !notesOn;
  noteBtn.setAttribute("aria-pressed", notesOn?"true":"false");
  if(notesOn) paintNotes();
  fit();
}

/* ---------- navigation ---------- */
const bar = document.querySelector("#bar i");
const cnt = document.getElementById("cnt");
function go(n){
  cur = Math.max(0, Math.min(DECK.length-1, n));
  slides.forEach((el,i)=>el.classList.toggle("on", i===cur));
  bar.style.width = ((cur+1)/DECK.length*100)+"%";
  cnt.textContent = (cur+1)+" / "+DECK.length;
  const body = slides[cur].querySelector(".body");
  if(body) body.scrollTop = 0;
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){}
  const items = document.querySelectorAll("#tocbody button.it");
  items.forEach(b=>b.dataset.cur = (parseInt(b.dataset.i,10)===cur)?"1":"0");
  if(notesOn){ paintNotes(); notesEl.scrollTop = 0; }
}
function toggleToc(on){
  const t = document.getElementById("toc");
  t.hidden = (on===undefined) ? !t.hidden : !on;
}
document.getElementById("bnext").onclick = ()=>go(cur+1);
document.getElementById("bprev").onclick = ()=>go(cur-1);
document.getElementById("btoc").onclick  = ()=>toggleToc();
noteBtn.onclick = ()=>toggleNotes();

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key;
  const tocOpen = !document.getElementById("toc").hidden;
  if(k==="Escape"){ if(tocOpen){ toggleToc(false); e.preventDefault(); } return; }
  if(k==="o"||k==="O"||k==="ㅐ"){ toggleToc(); e.preventDefault(); return; }
  if(k==="n"||k==="N"||k==="ㅜ"){ toggleNotes(); e.preventDefault(); return; }
  if(tocOpen) return;
  if(k==="ArrowRight"||k==="ArrowDown"||k===" "||k==="PageDown"||k==="Enter"){ go(cur+1); e.preventDefault(); }
  else if(k==="ArrowLeft"||k==="ArrowUp"||k==="PageUp"||k==="Backspace"){ go(cur-1); e.preventDefault(); }
  else if(k==="Home"){ go(0); e.preventDefault(); }
  else if(k==="End"){ go(DECK.length-1); e.preventDefault(); }
  else if(k==="f"||k==="F"||k==="ㄹ"){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    e.preventDefault();
  }
});

/* click to advance, but never when selecting text or hitting the chrome */
document.getElementById("viewport").addEventListener("click",e=>{
  if(window.getSelection && String(window.getSelection())) return;
  if(e.target.closest(".body")) return;
  go(cur+1);
});

/* ---------- fit to viewport ---------- */
const viewport = document.getElementById("viewport");
function fit(){
  const nh = notesOn ? notesEl.offsetHeight : 0;
  viewport.style.bottom = nh+"px";
  const pad = 26;
  const s = Math.min((window.innerWidth-pad)/1280, (window.innerHeight-nh-pad)/720);
  stage.style.transform = "scale("+Math.max(s,0.1).toFixed(4)+")";
}
window.addEventListener("resize",fit);
fit();

const start = parseInt((location.hash||"").replace("#",""),10);
go(Number.isFinite(start) && start>0 ? start-1 : 0);
</script>
